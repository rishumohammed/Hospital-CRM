services:
  mysql:
    image: mysql:8.0
    container_name: hospital_crm_mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --explicit_defaults_for_timestamp=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_super_secure_password}
      MYSQL_DATABASE: ${DB_NAME:-hospital_crm}
      MYSQL_USER: ${DB_USER:-crm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-crm_secure_password}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_super_secure_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hospital_network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: hospital_crm_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: mysql://${DB_USER:-crm_user}:${DB_PASSWORD:-crm_secure_password}@mysql:3306/${DB_NAME:-hospital_crm}?charset=utf8mb4
      DB_HOST: mysql
      DB_PORT: 3306
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod-jwt-access-secret-change-me-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod-jwt-refresh-secret-change-me-32-chars}
      COOKIE_SECRET: ${COOKIE_SECRET:-prod-cookie-secret-change-me-32-chars}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
      MFA_ENABLED_DEFAULT: ${MFA_ENABLED_DEFAULT:-false}
    expose:
      - "4000"
    networks:
      - hospital_network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api/v1}
    container_name: hospital_crm_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-/api/v1}
    expose:
      - "3000"
    networks:
      - hospital_network

  nginx:
    image: nginx:alpine
    container_name: hospital_crm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - api
      - web
    networks:
      - hospital_network

volumes:
  mysql_data:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local

networks:
  hospital_network:
    driver: bridge

